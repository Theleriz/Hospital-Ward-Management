# Staff app: shared by the HTTP (80) and HTTPS (443) servers in nginx.conf

root /usr/share/nginx/html;
index index.html;

# The corridor board summary is served only on the board port (below)
location /api/board/ {
    return 404;
}

# Backend API; buffering is off so real-time event streams (SSE) reach the browser at once
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite whatever the client sent: the backend must see the real address
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
}

# Single-page app: unknown paths fall back to index.html
location / {
    try_files $uri $uri/ /index.html;
}

# Corridor board requests per screen address: a screen asks every 1-2 s,
# so 5 per second with a small burst is plenty and stops a flood early.
limit_req_zone $binary_remote_addr zone=corridor_board:1m rate=5r/s;

# Staff app (port 80 in the container, 8080 on the host)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The corridor board summary is served only on the board port (below)
    location /api/board/ {
        return 404;
    }

    # Backend API; buffering is off so real-time event streams (SSE) reach the browser at once
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite whatever the client sent: the backend must see the real address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Corridor board (port 81 in the container, 8081 on the host): no login, read only.
# Serves the board page, its files and one API call; nothing else of the system.
# Who may see it is decided by the backend: internal networks or known screens
# (decisions.md, record 14).
server {
    listen 81;
    server_name _;

    root /usr/share/nginx/html;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = / {
        try_files /board.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /api/board/summary {
        limit_except GET {
            deny all;
        }
        limit_req zone=corridor_board burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend believes this header only from this proxy (MEDBASE_BOARD_TRUSTED_PROXIES)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        # The board never signs in: a staff session cookie must not travel with it
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}

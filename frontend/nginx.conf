# Corridor board requests per screen address: a screen asks every 1-2 s,
# so 5 per second with a small burst is plenty and stops a flood early.
limit_req_zone $binary_remote_addr zone=corridor_board:1m rate=5r/s;

# Staff app over HTTP (port 80 in the container, 8080 on the host): this computer
# only, for scripts, CI and the badge reader. Kept as it was.
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/staff-app.conf;
}

# Staff app over HTTPS (port 443 in the container, 8443 on the host). The browser
# gives the camera (badge scan) only to HTTPS pages; a phone or tablet on the ward
# network opens https://<this computer>:8443. The certificate is made on first
# start by docker/10-medbase-cert.sh, or mount your own (README, "HTTPS").
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/medbase.crt;
    ssl_certificate_key /etc/nginx/certs/medbase.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/staff-app.conf;
}

# Corridor board (port 81 in the container, 8081 on the host): no login, read only.
# Serves the board page, its files and one API call; nothing else of the system.
# Who may see it is decided by the backend: internal networks or known screens
# (decisions.md, record 15).
server {
    listen 81;
    server_name _;

    root /usr/share/nginx/html;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = / {
        try_files /board.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /api/board/summary {
        limit_except GET {
            deny all;
        }
        limit_req zone=corridor_board burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend believes this header only from this proxy (MEDBASE_BOARD_TRUSTED_PROXIES)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        # The board never signs in: a staff session cookie must not travel with it
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}

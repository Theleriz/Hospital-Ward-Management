services:
  db:
    image: postgres:17
    container_name: medbase-postgres
    environment:
      POSTGRES_USER: medbase
      POSTGRES_PASSWORD: medbase
      POSTGRES_DB: hospital_ward
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - medbase-data:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check: the temporary server used during init only listens on a socket,
      # so the container becomes healthy only after setup.sql has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U medbase -d hospital_ward"]
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    container_name: medbase-backend
    environment:
      # medbase_api: no data access of its own, switches to the user's role per request
      MEDBASE_DATABASE_URL: postgresql://medbase_api:medbase_api@db:5432/hospital_ward
      # Development value; set a long random secret for any real installation
      MEDBASE_SESSION_SECRET: dev-only-session-secret-change-me
      # DEMO ONLY: true lets the badge alone log in, without the PIN (decisions.md, record 16)
      MEDBASE_DEMO_BADGE_LOGIN: ${MEDBASE_DEMO_BADGE_LOGIN:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: medbase-frontend
    environment:
      # Extra names / IP addresses for the HTTPS certificate, e.g. this computer's
      # address on the ward Wi-Fi so a phone or tablet can open it (README, "HTTPS")
      MEDBASE_CERT_HOSTS: ${MEDBASE_CERT_HOSTS:-}
    volumes:
      - medbase-certs:/etc/nginx/certs
    ports:
      - "127.0.0.1:8080:80"
      # HTTPS: the camera works only here. Local only by default; set
      # MEDBASE_HTTPS_BIND=0.0.0.0 to open it to phones and tablets on the network.
      - "${MEDBASE_HTTPS_BIND:-127.0.0.1}:${MEDBASE_HTTPS_PORT:-8443}:443"
      # Corridor board (no login). Local only by default; for real corridor screens
      # publish it on the hospital network interface (decisions.md, record 15).
      # MEDBASE_BOARD_PORT changes the host port if 8081 is taken.
      - "127.0.0.1:${MEDBASE_BOARD_PORT:-8081}:81"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  medbase-data:
  medbase-certs:

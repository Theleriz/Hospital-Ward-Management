services:
  db:
    image: postgres:17
    container_name: medbase-postgres
    environment:
      POSTGRES_USER: medbase
      POSTGRES_PASSWORD: medbase
      POSTGRES_DB: hospital_ward
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - medbase-data:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check: the temporary server used during init only listens on a socket,
      # so the container becomes healthy only after setup.sql has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U medbase -d hospital_ward"]
      interval: 2s
      retries: 30

volumes:
  medbase-data:

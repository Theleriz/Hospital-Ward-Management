name: CI

# main must always be demo-ready (NFR-06): every PR and every push to main
# checks the database, the backend, the frontend and the whole system together.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Database from scratch, SQL tests, demo, re-run of setup.sql (scripts/check-db.sh).
  # The job name is a required check in the main ruleset: do not rename it.
  db-check:
    name: db-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check database is demo-ready
        run: bash scripts/check-db.sh

      - name: Check backup and restore (T-44)
        run: bash scripts/check-backup.sh

      - name: Database logs
        if: failure()
        run: docker logs medbase-postgres

      - name: Stop database
        if: always()
        run: docker compose down -v

  # pytest against a fresh database built by db/setup.sql
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start database
        working-directory: .
        run: docker compose up -d --wait db

      # The tests turn the escalation worker off and reload the seed data themselves
      - name: Run tests
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

      - name: Database logs
        if: failure()
        run: docker logs medbase-postgres

      - name: Stop database
        if: always()
        working-directory: .
        run: docker compose down -v

  # TypeScript check and production build of the React app
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

  # NFR-05: the whole system starts with one command; the app answers through nginx
  system-start:
    name: system-start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build and start db, backend, frontend
        run: docker compose up -d --build --wait

      - name: Frontend is served
        run: curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'

      - name: API answers through nginx, database connected
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health | tee health.json
          grep -q '"database":"ok"' health.json

      - name: Login works end to end (test head nurse from the seed)
        run: |
          curl --fail --silent --show-error -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"badge_id":"BADGE-1010","pin":"1010"}' http://127.0.0.1:8080/api/auth/login
          curl --fail --silent --show-error -b cookies.txt http://127.0.0.1:8080/api/reports/alerts?hours=24 >/dev/null

      - name: Service logs
        if: failure()
        run: docker compose logs

      - name: Stop system
        if: always()
        run: docker compose down -v

# Real backend restart demonstration in a private, disposable database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: medbase
      POSTGRES_PASSWORD: medbase
      POSTGRES_DB: hospital_ward
    volumes:
      - ./db:/db:ro
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U medbase -d hospital_ward']
      interval: 2s
      retries: 30
  backend:
    build: ./backend
    environment:
      MEDBASE_DATABASE_URL: postgresql://medbase_api:medbase_api@db:5432/hospital_ward
      MEDBASE_ESCALATION_ENABLED: 'false'
      MEDBASE_SESSION_SECRET: isolated-lockout-check-only
    depends_on:
      db:
        condition: service_healthy
  check:
    image: python:3.12-slim
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    volumes:
      - ./scripts/check_login_restart.py:/check.py:ro
      - ./artifacts/login-lockout:/results
    entrypoint: [python, /check.py]
